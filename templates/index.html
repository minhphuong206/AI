<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chấm Công AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; text-align: center; }
        .header { background-color: #2c3e50; color: white; padding: 15px; }
        .nav-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .camera-container { margin: 20px auto; background: white; padding: 20px; border-radius: 10px; width: fit-content; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; margin: 5px; font-weight: bold; color: white; transition: 0.3s;}
        .btn-start { background-color: #27ae60; }
        .btn-stop { background-color: #e74c3c; display: none; }
        #camera-feed { display: none; border: 3px solid #ddd; margin-top: 15px; border-radius: 5px; max-width: 600px;}
        #log-result { margin-top: 15px; font-size: 18px; color: #27ae60; font-weight: bold; min-height: 25px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hệ Thống Chấm Công</h1>
        <a href="/history" class="nav-btn" target="_blank">Xem Lịch Sử Chấm Công</a>
    </div>

    <div class="camera-container">
        <div>
            <button class="btn btn-start" id="start-btn" onclick="startCamera()">Bắt Đầu Chấm Công</button>
            <button class="btn btn-stop" id="stop-btn" onclick="stopCamera()">Tắt Chấm Công</button>
        </div>
        
        <img id="camera-feed" src="">
        <div id="log-result">Hệ thống đang ở chế độ chờ...</div>
    </div>

    <script>
        let pollingInterval;

        function startCamera() {
            document.getElementById('camera-feed').src = "{{ url_for('video_feed') }}?" + new Date().getTime();
            document.getElementById('camera-feed').style.display = "block";
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('stop-btn').style.display = "inline-block";
            document.getElementById('log-result').innerText = "Camera đang bật, vui lòng đưa mặt vào...";
            document.getElementById('log-result').style.color = "#333";

            // Quét liên tục để cập nhật thông báo
            pollingInterval = setInterval(checkAttendance, 1000);
        }

        function stopCamera() {
            document.getElementById('camera-feed').src = "";
            document.getElementById('camera-feed').style.display = "none";
            document.getElementById('start-btn').style.display = "inline-block";
            document.getElementById('stop-btn').style.display = "none";
            document.getElementById('log-result').innerText = "Đã tắt hệ thống chấm công.";
            document.getElementById('log-result').style.color = "#333";
            clearInterval(pollingInterval);
        }

        function checkAttendance() {
            fetch('/check_status')
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    // Hiện thông báo nhưng KHÔNG TẮT CAMERA
                    document.getElementById('log-result').innerText = "✅ " + data.name + " đã chấm công lúc " + data.time;
                    document.getElementById('log-result').style.color = "#27ae60";
                    
                    // Tự động xóa dòng chữ sau 4 giây để đón người tiếp theo
                    setTimeout(() => {
                        document.getElementById('log-result').innerText = "Camera đang bật, tiếp tục quét...";
                        document.getElementById('log-result').style.color = "#333";
                    }, 4000);
                }
            });
        }
    </script>
</body>
</html>
